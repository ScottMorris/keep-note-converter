name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_path:
        description: "Base path for the published site (e.g. /keep-note-converter). Leave empty to default to the repo name."
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  basepath:
    runs-on: ubuntu-latest
    outputs:
      base_path: ${{ steps.basepath.outputs.base_path }}
    steps:
      - name: Resolve base path
        id: basepath
        run: |
          RAW_INPUT="${{ github.event.inputs.base_path }}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          if [ -n "$RAW_INPUT" ]; then
            VALUE="$RAW_INPUT"
          elif [[ "$REPO_NAME" == *.github.io ]]; then
            VALUE="/"
          else
            VALUE="/$REPO_NAME"
          fi

          VALUE="/${VALUE#/}"
          VALUE="${VALUE%/}"

          if [ "$VALUE" = "/" ]; then
            VALUE=""
          fi

          echo "Using base path '$VALUE'"
          echo "base_path=$VALUE" >> "$GITHUB_OUTPUT"

  unit-tests:
    runs-on: ubuntu-latest
    needs: basepath
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ needs.basepath.outputs.base_path }}
        run: |
          mkdir -p reports
          npm test -- --reporter=junit --outputFile=reports/vitest-junit.xml

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: reports
          if-no-files-found: ignore

  e2e-tests:
    runs-on: ubuntu-latest
    needs: basepath
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set Playwright cache path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/ms-playwright" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json', 'playwright.config.ts') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run e2e tests
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ needs.basepath.outputs.base_path }}
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000${{ needs.basepath.outputs.base_path }}
        run: npm run e2e -- --reporter=junit,html

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results.xml
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: [basepath, unit-tests, e2e-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ needs.basepath.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
