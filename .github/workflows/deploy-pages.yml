name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_path:
        description: "Base path for the published site (e.g. /keep-note-converter). Leave empty to default to the repo name."
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Resolve base path
        id: basepath
        run: |
          RAW_INPUT="${{ github.event.inputs.base_path }}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          if [ -n "$RAW_INPUT" ]; then
            VALUE="$RAW_INPUT"
          elif [[ "$REPO_NAME" == *.github.io ]]; then
            VALUE="/"
          else
            VALUE="/$REPO_NAME"
          fi

          VALUE="/${VALUE#/}"
          VALUE="${VALUE%/}"

          if [ "$VALUE" = "/" ]; then
            VALUE=""
          fi

          echo "Using base path '$VALUE'"
          echo "base_path=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
